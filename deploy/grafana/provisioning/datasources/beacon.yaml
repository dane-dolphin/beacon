apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: beacon-vm
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      timeInterval: 1s        # native resolution is 1 Hz (§4)

  - name: Loki
    uid: beacon-loki
    type: loki
    access: proxy
    url: http://loki:3100
