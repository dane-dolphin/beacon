# Loki single-binary, chunks in S3 (§2.4) — cloud deployment.
# Requires: LOKI_S3_BUCKET and AWS_REGION env (compose passes them through);
# credentials come from the EC2 instance profile.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    s3:
      bucketnames: ${LOKI_S3_BUCKET}
      region: ${AWS_REGION}
      s3forcepathstyle: false
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h            # 30 days (§2.4)
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
