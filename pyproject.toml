[project]
name = "beacon-collector"
version = "0.1.0"
description = "Dolphin Stick lab telemetry collector (NUC side)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "duckdb>=0.10"]

[project.scripts]
beacon = "beacon_collector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["collector"]
include = ["beacon_collector*"]

[tool.pytest.ini_options]
testpaths = ["collector/tests"]
